<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Betül 🤍</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff0f4;--ink:#3b0f26;--acc:#e11d62;--acc2:#ff7aa2;--glass:#ffffff88;--b1:#ff9ec0;--b2:#ffc6a8;--b3:#d6a4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14040e;--ink:#ffe3ee;--acc:#ff4d8d;--acc2:#ffa3c2;--glass:#ffffff12;--b1:#c2185b;--b2:#7b1fa2;--b3:#ff5722}}
:root[data-theme="dark"]{--bg:#14040e;--ink:#ffe3ee;--acc:#ff4d8d;--acc2:#ffa3c2;--glass:#ffffff12;--b1:#c2185b;--b2:#7b1fa2;--b3:#ff5722}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:hidden;background:var(--bg)}
body{color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.aur{position:fixed;inset:0;z-index:0;overflow:hidden}
.aur i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.aur i:nth-child(1){background:var(--b1);left:-15vmax;top:-10vmax}
.aur i:nth-child(2){background:var(--b2);right:-20vmax;top:20vmax;animation-delay:-6s}
.aur i:nth-child(3){background:var(--b3);left:10vmax;bottom:-25vmax;animation-delay:-11s}
@keyframes drift{to{transform:translate(8vmax,-6vmax) scale(1.25)}}
canvas{position:fixed;inset:0;z-index:1;pointer-events:none}
section{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px;position:relative;z-index:3}
.heart{width:min(52vw,230px);position:relative;transition:transform .15s;margin-bottom:6px}
.heart svg{width:100%;display:block;animation:beat 1.4s infinite;filter:drop-shadow(0 0 28px #ff2d78aa)}
.heart:before,.heart:after{content:"";position:absolute;inset:8%;border-radius:50%;border:2px solid var(--acc);animation:ring 2.8s infinite;opacity:0}
.heart:after{animation-delay:1.4s}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.09)}}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
h1{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:clamp(4.2rem,21vw,8.5rem);line-height:1.05;background:linear-gradient(100deg,var(--acc),#ffd1e1,var(--acc),var(--acc2));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 6px 26px #ff4d8d66)}
@keyframes shine{to{background-position:-250% 0}}
.hint{margin-top:14px;opacity:.75;animation:pulse 2s infinite;letter-spacing:.08em}
@keyframes pulse{50%{opacity:.25}}
.pop{position:fixed;pointer-events:none;z-index:2;font-weight:600;white-space:nowrap;color:var(--acc);text-shadow:0 0 18px #ff4d8d88;animation:pop 3s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(var(--r));opacity:0}12%{transform:translate(-50%,-50%) scale(1.25) rotate(var(--r));opacity:1}25%{transform:translate(-50%,-50%) scale(1) rotate(var(--r))}100%{transform:translate(-50%,-100%) scale(1) rotate(var(--r));opacity:0}}
.card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #ffffff55;border-radius:32px;padding:46px 26px 40px;width:min(92vw,520px);box-shadow:0 20px 70px #e11d6244}
h2{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:clamp(2rem,8vw,3rem);margin-bottom:30px}
.row{display:flex;gap:16px;align-items:center;justify-content:center;min-height:74px}
button{border:0;border-radius:99px;padding:16px 38px;font:inherit;font-weight:600;font-size:1.1rem;color:#fff;cursor:pointer;transition:transform .2s}
#y{background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 10px 34px #e11d6277;animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 10px 50px #ff4d8dcc}}
#n{background:#6b7280;touch-action:none}
#ans{margin-top:26px;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.9rem;min-height:2.6em}
.sg{font-size:1.3rem;opacity:.85;display:block;margin-top:6px}
</style>
</head>
<body>
<div class="aur"><i></i><i></i><i></i></div>
<canvas id="c"></canvas>

<section>
  <div class="heart" id="hr"><svg viewBox="0 0 100 90"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8fb8"/><stop offset=".55" stop-color="#ff2d78"/><stop offset="1" stop-color="#b0124e"/></linearGradient></defs><path fill="url(#g)" d="M50 86C10 56 0 36 0 22 0 9 11 0 24 0c11 0 20 6 26 15C56 6 65 0 76 0c13 0 24 9 24 22 0 14-10 34-50 64z"/><path fill="#fff" opacity=".35" d="M16 14c4-5 11-7 16-3-7-1-12 2-14 8-1 2-3-1-2-5z"/></svg></div>
  <h1>Betül</h1>
  <p class="hint">bi dokun 🤍</p>
</section>

<section>
  <div class="card">
    <h2>Benimle kalır mısın?</h2>
    <div class="row"><button id="y">Evet 💖</button><button id="n">Hayır</button></div>
    <div id="ans"></div>
  </div>
</section>

<script>
var L=["Seni seviyorum","I love you","Je t'aime","Te amo","Ti amo","Ich liebe dich","愛してる","사랑해","我爱你","Я тебя люблю","أحبك","Σ'αγαπώ","Ik hou van je","Kocham cię","Te iubesc","Volim te","Szeretlek","Rakastan sinua","Mahal kita","Aku cinta kamu","मैं तुमसे प्यार करता हूँ","Jag älskar dig","Jeg elsker deg","Miluji tě","Seni sevirəm","Ég elska þig","Mi amas vin"];
function pop(x,y){var s=document.createElement("div");s.className="pop";s.textContent=L[Math.random()*L.length|0];s.style.left=Math.min(Math.max(x,80),innerWidth-80)+"px";s.style.top=y+"px";s.style.fontSize=(16+Math.random()*22)+"px";s.style.setProperty("--r",(Math.random()*30-15)+"deg");document.body.appendChild(s);setTimeout(function(){s.remove()},3100)}
function rnd(){pop(Math.random()*innerWidth,Math.random()*innerHeight*.9+30)}
setInterval(rnd,380);for(var i=0;i<12;i++)setTimeout(rnd,i*90);

var cv=document.getElementById("c"),cx=cv.getContext("2d"),P=[],C=["#ff2d78","#ff6b9d","#ffa3c2","#ffffff","#ff4d4d","#ffb3d1"];
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener("resize",fit);
function add(o){P.push(Object.assign({r:Math.random()*6.28,vr:(Math.random()-.5)*.05,a:1,c:C[Math.random()*C.length|0],g:0,t:Math.random()*6},o))}
function rise(){add({x:Math.random()*innerWidth,y:innerHeight+30,vx:0,vy:-(.6+Math.random()*1.4),s:6+Math.random()*16,sw:1,d:.0008})}
function burst(x,y,n){for(var i=0;i<n;i++){var an=Math.random()*6.28,sp=2+Math.random()*7;add({x:x,y:y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-2,s:5+Math.random()*13,g:.14,d:.012})}}
setInterval(rise,220);for(var i=0;i<18;i++){rise();P[P.length-1].y=Math.random()*innerHeight}
function hp(s){cx.beginPath();cx.moveTo(0,s*.35);cx.bezierCurveTo(-s,-s*.3,-s*.6,-s*1.1,0,-s*.5);cx.bezierCurveTo(s*.6,-s*1.1,s,-s*.3,0,s*.35);cx.fill()}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);
 for(var i=P.length-1;i>=0;i--){var p=P[i];p.t+=.03;p.vy+=p.g;p.x+=p.vx+(p.sw?Math.sin(p.t)*.6:0);p.y+=p.vy;p.vx*=p.g?.99:1;p.r+=p.vr;p.a-=p.d;
  if(p.a<=0||p.y<-40||p.y>innerHeight+60){P.splice(i,1);continue}
  cx.save();cx.translate(p.x,p.y);cx.rotate(Math.sin(p.r)*.5);cx.globalAlpha=Math.min(p.a,.85);cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=12;hp(p.s);cx.restore()}
 requestAnimationFrame(loop)})();

addEventListener("pointerdown",function(e){burst(e.clientX,e.clientY,14);for(var i=0;i<3;i++)setTimeout(function(){pop(e.clientX+(Math.random()*160-80),e.clientY+(Math.random()*120-60))},i*80)});
var lt=0;addEventListener("pointermove",function(e){var n=Date.now();if(n-lt<45)return;lt=n;add({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*1.2,vy:-.8-Math.random(),s:4+Math.random()*7,d:.025})});
var hr=document.getElementById("hr");addEventListener("pointermove",function(e){var x=(e.clientX/innerWidth-.5)*24,y=(e.clientY/innerHeight-.5)*-24;hr.style.transform="perspective(600px) rotateY("+x+"deg) rotateX("+y+"deg)"});

var n=document.getElementById("n"),y=document.getElementById("y"),k=0;
function dodge(e){if(e){e.preventDefault();e.stopPropagation()}
 k++;n.style.position="fixed";n.style.zIndex=9;
 var w=n.offsetWidth,h=n.offsetHeight;
 n.style.left=Math.random()*(innerWidth-w-20)+10+"px";
 n.style.top=Math.random()*(innerHeight-h-40)+20+"px";
 y.style.transform="scale("+Math.min(1+k*.12,2)+")";
 if(k===6)n.textContent="Basamazsın 😏";
 if(k===12)n.textContent="Pes et 😂"}
["pointerenter","pointerdown","touchstart","click","focus"].forEach(function(t){n.addEventListener(t,dodge,{passive:false})});
y.onclick=function(){n.style.display="none";var r=y.getBoundingClientRect();
 for(var i=0;i<6;i++)setTimeout(function(){burst(Math.random()*innerWidth,Math.random()*innerHeight*.7,40)},i*220);
 for(var i=0;i<30;i++)setTimeout(rnd,i*45);
 document.getElementById("ans").innerHTML="Biliyordum 😌💖<span class='sg'>— pampin</span>"};
</script>
</body>
</html>
